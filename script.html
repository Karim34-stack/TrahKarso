<script>
var members = [];

document.addEventListener('DOMContentLoaded', function() {
  document.getElementById('search').oninput = render;
  document.getElementById('generation').onchange = render;
  document.getElementById('limit').onchange = render;

  document.getElementById('closeModal').onclick = function() {
    document.getElementById('modal').classList.add('hidden');
  };

  google.script.run
    .withSuccessHandler(function(data) {
      if (!data || !data.ok) {
        fail('Data tidak tersedia.');
        return;
      }

      members = data.members || [];
      fillGenerations();
      render();
    })
    .withFailureHandler(function(error) {
      fail(error && error.message ? error.message : String(error));
    })
    .getData();
});

function fail(message) {
  document.getElementById('status').textContent =
    'Gagal memuat data: ' + message;
}

function fillGenerations() {
  var values = [];
  var seen = {};
  var i;

  for (i = 0; i < members.length; i++) {
    var g = String(members[i].generasi || '');

    if (g && !seen[g]) {
      seen[g] = true;
      values.push(g);
    }
  }

  values.sort(function(a, b) {
    return Number(a) - Number(b);
  });

  var html = '<option value="">Semua generasi</option>';

  for (i = 0; i < values.length; i++) {
    html += '<option value="' + esc(values[i]) + '">Generasi ' +
      esc(values[i]) + '</option>';
  }

  document.getElementById('generation').innerHTML = html;
}

function render() {
  var q = document.getElementById('search').value.toLowerCase().trim();
  var g = document.getElementById('generation').value;
  var limit = Number(document.getElementById('limit').value || 0);
  var filtered = [];
  var i;

  for (i = 0; i < members.length; i++) {
    var m = members[i];
    var name = String(m.nama || '').toLowerCase();

    if (q && name.indexOf(q) === -1) continue;
    if (g && String(m.generasi || '') !== g) continue;

    filtered.push(m);
  }

  if (limit) {
    filtered = filtered.slice(0, limit);
  }

  var ids = {};
  for (i = 0; i < filtered.length; i++) {
    ids[String(filtered[i].id)] = true;
  }

  var roots = [];
  for (i = 0; i < filtered.length; i++) {
    var parent = String(filtered[i].orang_tua_id || '');

    if (!parent || !ids[parent]) {
      roots.push(filtered[i]);
    }
  }

  var tree = document.getElementById('tree');
  tree.innerHTML = '';

  document.getElementById('status').textContent =
    filtered.length + ' anggota ditampilkan. Pasangan hanya di footer card.';

  var row = document.createElement('div');
  row.className = 'generation-row';

  for (i = 0; i < roots.length; i++) {
    row.appendChild(buildNode(roots[i], filtered));
  }

  tree.appendChild(row);
}

function buildNode(member, all) {
  var node = document.createElement('div');
  node.className = 'node';
  node.appendChild(makeCard(member));

  var children = [];

  for (var i = 0; i < all.length; i++) {
    if (String(all[i].orang_tua_id || '') === String(member.id)) {
      children.push(all[i]);
    }
  }

  children.sort(function(a, b) {
    return Number(a.anak_ke || 999) - Number(b.anak_ke || 999);
  });

  if (children.length) {
    var line = document.createElement('div');
    line.className = 'child-line';
    node.appendChild(line);

    var row = document.createElement('div');
    row.className = 'generation-row';
    row.style.margin = '18px 0 0';

    for (var j = 0; j < children.length; j++) {
      row.appendChild(buildNode(children[j], all));
    }

    node.appendChild(row);
  }

  return node;
}

function makeCard(member) {
  var card = document.createElement('div');
  card.className = 'card';

  var dead = String(member.status_hidup || '').toLowerCase() === 'wafat';
  var photo = member.foto_url || '';

  var html = '';

  if (photo) {
    html += '<img class="photo" src="' + attr(photo) + '" onerror="this.style.display=\'none\'">';
  } else {
    html += '<div class="photo"></div>';
  }

  html += '<div class="info">';
  html += '<div class="name">' + esc(member.nama) + '</div>';
  html += '<div class="order">' +
    (member.anak_ke ? 'Anak ke-' + esc(member.anak_ke) : 'Anak ke-?') +
    '</div>';

  html += '<span class="badge ' + (dead ? 'dead' : 'alive') + '">' +
    (dead ? '⚫ Wafat' : '🟢 Hidup');

  if (dead && member.tanggal_wafat) {
    html += ' · ' + dateId(member.tanggal_wafat);
  }

  html += '</span>';

  if (member.bio) {
    html += '<div class="bio">' + esc(member.bio) + '</div>';
  }

  html += '<div class="spouses"><b>Pasangan:</b> ';

  var spouses = member.pasangan || [];

  if (spouses.length) {
    for (var i = 0; i < spouses.length; i++) {
      if (i > 0) html += '<br>';
      html += 'Istri ' + (i + 1) + ': ' +
        esc(spouses[i].nama_pasangan);
    }
  } else {
    html += 'Belum ada data';
  }

  html += '</div></div>';

  card.innerHTML = html;
  card.onclick = function() {
    showDetail(member);
  };

  return card;
}

function showDetail(member) {
  var children = [];
  var grandchildren = [];
  var i;
  var j;

  for (i = 0; i < members.length; i++) {
    if (String(members[i].orang_tua_id || '') === String(member.id)) {
      children.push(members[i]);
    }
  }

  children.sort(function(a, b) {
    return Number(a.anak_ke || 999) - Number(b.anak_ke || 999);
  });

  for (i = 0; i < children.length; i++) {
    for (j = 0; j < members.length; j++) {
      if (String(members[j].orang_tua_id || '') === String(children[i].id)) {
        grandchildren.push(members[j]);
      }
    }
  }

  var dead = String(member.status_hidup || '').toLowerCase() === 'wafat';
  var spouses = member.pasangan || '';
  var html = '<div class="detail-head">';

  if (member.foto_url) {
    html += '<img src="' + attr(member.foto_url) + '">';
  }

  html += '<div><h2>' + esc(member.nama) + '</h2>';
  html += '<div class="order">' +
    (member.anak_ke ? 'Anak ke-' + esc(member.anak_ke) : 'Anak ke-?') +
    '</div>';
  html += '<span class="badge ' + (dead ? 'dead' : 'alive') + '">' +
    (dead ? '⚫ Wafat' : '🟢 Hidup') + '</span></div></div>';

  html += '<div class="detail-section"><h3>Bio</h3><p>' +
    esc(member.bio || 'Belum ada bio.') + '</p></div>';

  html += '<div class="detail-section"><h3>Pasangan</h3><div class="pills">';

  if (spouses.length) {
    for (i = 0; i < spouses.length; i++) {
      html += '<div class="pill">Istri ' + (i + 1) + ': ' +
        esc(spouses[i].nama_pasangan) + '</div>';
    }
  } else {
    html += '<div class="pill">Belum ada data pasangan.</div>';
  }

  html += '</div></div>';

  html += '<div class="detail-section"><h3>Anak</h3><div class="pills">';

  if (children.length) {
    for (i = 0; i < children.length; i++) {
      html += '<div class="pill">' + esc(children[i].nama) + '</div>';
    }
  } else {
    html += '<div class="pill">Belum ada data anak.</div>';
  }

  html += '</div></div>';

  html += '<div class="detail-section"><h3>Cucu</h3><div class="pills">';

  if (grandchildren.length) {
    for (i = 0; i < grandchildren.length; i++) {
      html += '<div class="pill">' + esc(grandchildren[i].nama) + '</div>';
    }
  } else {
    html += '<div class="pill">Belum ada data cucu.</div>';
  }

  html += '</div></div>';

  document.getElementById('detail').innerHTML = html;
  document.getElementById('modal').classList.remove('hidden');
}

function dateId(value) {
  return new Date(value).toLocaleDateString('id-ID');
}

function esc(value) {
  return String(value == null ? '' : value).replace(/[&<>"']/g, function(c) {
    var map = {
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#39;'
    };
    return map[c];
  });
}

function attr(value) {
  return esc(value).replace(/`/g, '&#96;');
}
</script>
