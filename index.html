<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Silsilah Keluarga</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div>
      <h1>Silsilah Keluarga</h1>
      <p>Pohon keturunan asli keluarga</p>
    </div>
    <div class="toolbar">
      <input id="search" type="search" placeholder="Cari nama...">
      <select id="generation"><option value="">Semua generasi</option></select>
      <select id="limit">
        <option value="0">Semua anggota</option>
        <option value="20">20 anggota</option>
        <option value="50">50 anggota</option>
        <option value="100">100 anggota</option>
      </select>
    </div>
  </header>

  <main>
    <section class="tree-wrap">
      <div id="status" class="status">Memuat data...</div>
      <div id="tree" class="tree"></div>
    </section>
  </main>

  <div id="modal" class="modal hidden">
    <div class="modal-card">
      <button id="closeModal" class="close">×</button>
      <div id="detail"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
