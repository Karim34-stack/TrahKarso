<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Silsilah Keluarga Interaktif</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">

    <!-- Header -->
    <header class="bg-indigo-600 text-white p-4 shadow-md sticky top-0 z-40">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl md:text-2xl font-bold">🌳 Silsilah Keluarga</h1>
            <button onclick="openModalForAdd()" class="bg-amber-400 hover:bg-amber-500 text-indigo-900 font-semibold px-4 py-2 rounded-lg shadow transition">
                + Tambah Anggota
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto p-4 md:p-6">
        <div id="loading" class="text-center py-12">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-indigo-600 border-t-transparent"></div>
            <p class="text-gray-500 text-sm mt-2">Memuat data dari Google Sheets...</p>
        </div>

        <div id="tree-container" class="space-y-8 hidden">
            <!-- Render Silsilah -->
        </div>
    </main>

    <!-- Modal Form (Tambah / Edit) -->
    <div id="modal" class="fixed inset-0 bg-black/50 flex items-center justify-center hidden z-50 p-4 overflow-y-auto">
        <div class="bg-white rounded-xl shadow-xl w-full max-w-md p-6 relative my-8">
            <h2 id="modal-title" class="text-xl font-bold mb-4 text-indigo-900">Tambah Anggota Keluarga</h2>
            
            <form id="family-form" onsubmit="handleSubmit(event)">
                <input type="hidden" id="member-id">
                
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium mb-1">Nama Lengkap</label>
                        <input type="text" id="nama" required class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-indigo-500">
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium mb-1">Jenis Kelamin</label>
                            <select id="gender" class="w-full border rounded-lg p-2">
                                <option value="L">Laki-Laki</option>
                                <option value="P">Perempuan</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1">Generasi Ke-</label>
                            <input type="number" id="generasi" min="1" value="1" required class="w-full border rounded-lg p-2">
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium mb-1">Pilih Ayah (Opsional)</label>
                        <select id="ayahId" class="w-full border rounded-lg p-2">
                            <option value="">-- Tidak Ada --</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium mb-1">URL Foto / Upload Gambar</label>
                        <input type="text" id="foto" placeholder="https://domain.com/foto.jpg" class="w-full border rounded-lg p-2 text-sm mb-2">
                        <input type="file" id="file-input" accept="image/*" onchange="handleFileUpload(event)" class="text-xs text-slate-500">
                        <div id="image-preview" class="mt-2 hidden">
                            <img id="preview-img" class="w-16 h-16 rounded-full object-cover border">
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium mb-1">Catatan / Bio Ringkas</label>
                        <textarea id="catatan" rows="2" class="w-full border rounded-lg p-2 text-sm"></textarea>
                    </div>
                </div>

                <div class="mt-6 flex justify-end gap-3">
                    <button type="button" onclick="toggleModal(false)" class="px-4 py-2 border rounded-lg hover:bg-gray-100">Batal</button>
                    <button type="submit" id="submit-btn" class="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700">Simpan</button>
                </div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
