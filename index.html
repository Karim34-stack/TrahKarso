<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Silsilah Keluarga - Integrated Google Sheets</title>
  <!-- Tailwind CSS & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-900 text-slate-100 flex flex-col h-screen overflow-hidden font-sans">

  <!-- TOP HEADER NAVBAR -->
  <header class="bg-slate-800/90 backdrop-blur-md border-b border-slate-700/60 px-4 py-3 flex flex-wrap items-center justify-between gap-3 z-20 shadow-lg">
    <div class="flex items-center space-x-3">
      <div class="p-2 bg-gradient-to-tr from-cyan-600 to-blue-600 rounded-xl shadow-md">
        <i data-lucide="git-fork" class="w-6 h-6 text-white"></i>
      </div>
      <div>
        <h1 class="text-lg font-bold text-white tracking-wide flex items-center gap-2">
          Silsilah Keluarga
          <span class="text-xs font-normal px-2 py-0.5 rounded-full bg-cyan-900/60 text-cyan-300 border border-cyan-700/50">Keturunan Asli</span>
        </h1>
        <p class="text-xs text-slate-400">Pohon Keturunan Bloodline & Google Sheets Integration</p>
      </div>
    </div>

    <!-- Center Search & Generation Filter -->
    <div class="flex items-center gap-2 flex-1 max-w-xl mx-auto">
      <div class="relative flex-1">
        <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3 top-1/2 transform -translate-y-1/2"></i>
        <input type="text" id="searchInput" placeholder="Cari nama anggota..." 
               class="w-full bg-slate-900/80 border border-slate-700 rounded-lg pl-9 pr-3 py-1.5 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-cyan-500 transition-colors">
      </div>
      
      <!-- Filter Generasi Dropdown -->
      <div class="relative min-w-[140px]">
        <select id="genFilterSelect" class="w-full bg-slate-900/80 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-cyan-400 font-medium focus:outline-none focus:border-cyan-500 cursor-pointer">
          <option value="ALL">Semua Generasi</option>
        </select>
      </div>
    </div>

    <!-- Right Admin Controls & Google Sheets Sync -->
    <div class="flex items-center space-x-2">
      <!-- Sync Status Indicator -->
      <button id="btnSyncSheets" class="flex items-center space-x-1.5 px-3 py-1.5 bg-emerald-600/20 hover:bg-emerald-600/30 text-emerald-300 border border-emerald-500/40 rounded-lg text-xs font-medium transition">
        <i data-lucide="refresh-cw" class="w-3.5 h-3.5 text-emerald-400" id="syncIcon"></i>
        <span id="syncText">Sync Sheets</span>
      </button>

      <!-- Admin Toggle Switch -->
      <label class="flex items-center cursor-pointer bg-slate-900/70 border border-slate-700 px-3 py-1.5 rounded-lg hover:border-slate-600 transition">
        <input type="checkbox" id="adminToggle" class="sr-only">
        <div class="w-8 h-4 bg-slate-700 rounded-full transition-colors relative" id="toggleBg">
          <div class="w-3 h-3 bg-white rounded-full absolute top-0.5 left-0.5 transition-transform" id="toggleDot"></div>
        </div>
        <span class="ml-2 text-xs font-semibold text-slate-300 select-none" id="adminLabel">Admin Off</span>
      </label>

      <button id="btnTambahTop" class="hidden flex items-center space-x-1 px-3 py-1.5 bg-cyan-600 hover:bg-cyan-500 text-white rounded-lg text-xs font-medium shadow-md transition">
        <i data-lucide="plus-circle" class="w-3.5 h-3.5"></i>
        <span>Tambah</span>
      </button>
    </div>
  </header>

  <!-- SECONDARY BAR: STATS & SPREADSHEET URL CONFIG -->
  <div class="bg-slate-800/40 border-b border-slate-700/40 px-4 py-1.5 flex flex-wrap items-center justify-between text-xs text-slate-400 gap-2 z-10">
    <div class="flex items-center gap-3 overflow-x-auto py-0.5" id="statsBadges">
      <div class="flex items-center gap-1 font-medium text-slate-300">
        <i data-lucide="users" class="w-3.5 h-3.5 text-cyan-400"></i>
        <span>Total: <strong id="statTotal" class="text-white">0</strong></span>
      </div>
      <span class="text-slate-600">|</span>
      <div class="flex items-center gap-1 text-slate-300">
        <span>Keturunan: <strong id="statKeturunan" class="text-cyan-300">0</strong></span>
      </div>
      <span class="text-slate-600">|</span>
      <div class="flex items-center gap-1 text-slate-300">
        <span>Pasangan: <strong id="statPasangan" class="text-pink-300">0</strong></span>
      </div>
    </div>

    <!-- App Script URL Config -->
    <div class="flex items-center gap-2">
      <span class="text-[10px] text-slate-500">Google Script URL:</span>
      <input type="text" id="scriptUrlInput" placeholder="https://script.google.com/macros/s/.../exec" 
             class="w-64 bg-slate-900 border border-slate-700/80 rounded px-2 py-0.5 text-[11px] text-slate-300 focus:outline-none focus:border-cyan-500">
      <button id="btnSaveScriptUrl" class="px-2 py-0.5 bg-slate-700 hover:bg-slate-600 text-slate-200 rounded text-[11px] transition">Set</button>
    </div>
  </div>

  <!-- MAIN CANVAS AREA -->
  <main class="flex-1 relative overflow-hidden bg-slate-950" id="canvasContainer">
    <div id="treeCanvas" class="absolute transform-gpu transition-transform origin-top-left cursor-grab">
      <svg id="svgLines" class="absolute top-0 left-0 w-full h-full pointer-events-none z-0"></svg>
      <div id="treeNodes" class="relative z-10 p-20"></div>
    </div>

    <!-- CANVAS ZOOM CONTROLS -->
    <div class="absolute bottom-5 right-5 flex flex-col space-y-2 z-20">
      <button id="btnZoomIn" class="p-2.5 bg-slate-800/90 hover:bg-slate-700 border border-slate-700 text-slate-200 rounded-xl shadow-lg transition">
        <i data-lucide="zoom-in" class="w-5 h-5"></i>
      </button>
      <button id="btnZoomOut" class="p-2.5 bg-slate-800/90 hover:bg-slate-700 border border-slate-700 text-slate-200 rounded-xl shadow-lg transition">
        <i data-lucide="zoom-out" class="w-5 h-5"></i>
      </button>
      <button id="btnResetZoom" class="p-2.5 bg-slate-800/90 hover:bg-slate-700 border border-slate-700 text-slate-200 rounded-xl shadow-lg transition">
        <i data-lucide="maximize-2" class="w-5 h-5"></i>
      </button>
    </div>
  </main>

  <!-- MODAL: BREAKDOWN DETAIL PASANGAN, ANAK & CUCU -->
  <div id="modalBreakdown" class="fixed inset-0 bg-black/75 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl max-w-3xl w-full max-h-[90vh] flex flex-col shadow-2xl overflow-hidden animate-in fade-in zoom-in-95 duration-150">
      <div class="p-5 bg-slate-800/90 border-b border-slate-700 flex items-center justify-between">
        <div class="flex items-center space-x-3" id="modalHeaderProfile"></div>
        <button id="btnCloseModal" class="p-1.5 hover:bg-slate-700 rounded-lg text-slate-400 hover:text-white transition">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      <div class="p-6 overflow-y-auto space-y-6 custom-scrollbar" id="modalBodyContent"></div>
    </div>
  </div>

  <!-- MODAL: FORM ADD / EDIT MEMBER -->
  <div id="modalForm" class="fixed inset-0 bg-black/75 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl max-w-lg w-full p-6 shadow-2xl overflow-hidden">
      <div class="flex items-center justify-between pb-4 border-b border-slate-700">
        <h3 class="text-base font-bold text-white flex items-center gap-2" id="formTitle">
          <i data-lucide="user-plus" class="w-5 h-5 text-cyan-400"></i>
          <span>Tambah Anggota</span>
        </h3>
        <button id="btnCloseForm" class="p-1 text-slate-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>

      <form id="memberForm" class="space-y-4 mt-4">
        <input type="hidden" id="formId">
        <input type="hidden" id="formType" value="KETURUNAN"> <!-- KETURUNAN or PASANGAN -->
        <input type="hidden" id="formAnggotaId">

        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Nama Lengkap</label>
          <input type="text" id="formNama" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-cyan-500">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Gelar / Panggilan</label>
            <input type="text" id="formGelar" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-cyan-500">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Jenis Kelamin</label>
            <select id="formGender" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-cyan-500">
              <option value="L">Laki-laki</option>
              <option value="P">Perempuan</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">No. WhatsApp / Telepon</label>
            <input type="text" id="formNoHp" placeholder="08123456789" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-cyan-500">
          </div>
          <div id="fieldParentContainer">
            <label class="block text-xs font-semibold text-slate-300 mb-1">Orang Tua (Keturunan)</label>
            <select id="formParentId" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-cyan-500">
              <option value="">-- Akar Utama (Gen I) --</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Path Foto / File (Folder `foto_profil/`)</label>
          <input type="text" id="formFoto" placeholder="foto_profil/nama_file.jpg" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-cyan-500">
        </div>

        <div class="pt-3 border-t border-slate-700 flex justify-end space-x-2">
          <button type="button" id="btnCancelForm" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-slate-200 rounded-lg text-xs font-medium">Batal</button>
          <button type="submit" class="px-4 py-2 bg-cyan-600 hover:bg-cyan-500 text-white rounded-lg text-xs font-medium shadow-md">Simpan Data</button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
