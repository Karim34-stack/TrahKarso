<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pohon Silsilah Keluarga</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <h1>Pohon Silsilah Keluarga</h1>
    <p>Garis Keturunan Asli</p>
    <button class="btn-add" onclick="openAddModal()">+ Tambah Anggota</button>
  </header>

  <main class="tree-container" id="treeContainer">
    <div class="loading">Memuat data silsilah...</div>
  </main>

  <!-- Modal Detail Anggota -->
  <div class="modal" id="detailModal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal('detailModal')">&times;</span>
      <div id="modalBody"></div>
    </div>
  </div>

  <!-- Modal Tambah Anggota Baru -->
  <div class="modal" id="addModal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal('addModal')">&times;</span>
      <h2>Tambah Anggota Keluarga Baru</h2>
      <form id="addForm" onsubmit="submitForm(event)">
        <div class="form-group">
          <label>Nama Lengkap*</label>
          <input type="text" id="nama_lengkap" required>
        </div>
        
        <div class="form-group">
          <label>Jenis Kelamin*</label>
          <select id="jenis_kelamin" required>
            <option value="L">Laki-laki</option>
            <option value="P">Perempuan</option>
          </select>
        </div>

        <div class="form-group">
          <label>Orang Tua (Garis Keturunan)*</label>
          <select id="id_orang_tua" onchange="updatePasanganParentOptions()">
            <option value="">-- Akar / Anggota Pertama --</option>
          </select>
        </div>

        <div class="form-group" id="pasanganParentGroup" style="display:none;">
          <label>Anak Dari Pasangan Orang Tua Ke-</label>
          <select id="id_pasangan_orang_tua">
            <option value="">-- Pilih Pasangan Orang Tua --</option>
          </select>
        </div>

        <div class="form-group">
          <label>Urutan Anak Ke-*</label>
          <input type="number" id="urutan_anak" min="1" value="1" required>
        </div>

        <div class="form-group">
          <label>Tanggal Lahir</label>
          <input type="date" id="tanggal_lahir">
        </div>

        <div class="form-group">
          <label>Bio / Catatan</label>
          <textarea id="bio" rows="3"></textarea>
        </div>

        <div class="form-group">
          <label>Foto Profil</label>
          <input type="file" id="foto_file" accept="image/*">
        </div>

        <div class="form-group">
          <label>Nama Pasangan (Opsional)</label>
          <input type="text" id="nama_pasangan" placeholder="Nama Suami/Istri">
        </div>

        <button type="submit" class="btn-submit" id="btnSubmit">Simpan Data</button>
      </form>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
